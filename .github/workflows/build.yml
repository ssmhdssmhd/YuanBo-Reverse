name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure pub mirror
        run: |
          flutter config --no-analytics
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APK with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | sed 's/+.*//')
          BUILD_DATE=$(date +%Y%m%d%H%M)
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$f" | sed 's/.*app-\(.*\)-release.apk/\1/')
            mv "$f" "build/app/outputs/flutter-apk/沫兮源播.${VERSION}_${abi}_${BUILD_DATE}.apk"
          done
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 沫兮源播-APK
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
